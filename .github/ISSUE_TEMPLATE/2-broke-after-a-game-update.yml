name: Broke after a game update
description: The game got a new version and a mod stopped working, switched itself off, or looks wrong since.
labels: ["bug", "game update"]
body:
  - type: markdown
    attributes:
      value: |
        The game is in early access, so this happens now and then: a mod that no longer fits switches itself
        off and says so in the log. If there is already a report for the same game version, add to it.
  - type: input
    id: game
    attributes:
      label: Game version
      description: The new one, at the top of the screen in the game.
      placeholder: 0.12.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: mods
    attributes:
      label: Mods affected
      multiple: true
      options:
        - Combat Simulator
        - Item Sources
        - Item Encyclopedia
        - Recipe Rates
        - Fishing Rates
        - Thieving Overview
        - Skill Bonuses
        - Astrology Overview
        - Away Summary
        - Combat Goals
        - Kills in Combat
        - Dungeon Completions
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you see
      description: Nothing at all, a message, a wrong number, something drawn in the wrong place. A screenshot says a lot.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Mod and loader version
      description: 'Both are in MelvorModLoader.log: "Melvor Mod Loader 0.2.0 starting" and "Mod loaded: RecipeRates 0.3.0".'
      placeholder: all of them at 0.3.0, loader 0.2.0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        MelvorModLoader.log from the game folder, copied after starting the game once on the new version. It
        names what a mod could not find, which is usually all that is needed to fix it. The loader writes
        your game folder's path into it, which you can remove.
      render: text
    validations:
      required: true
